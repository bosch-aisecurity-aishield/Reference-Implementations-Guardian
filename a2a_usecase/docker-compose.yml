services:
  # Finance Agent
  finance:
    build:
      context: ./Finance
      dockerfile: Dockerfile
    container_name: finance_agent
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - FINANCE_MODEL=${FINANCE_MODEL}
      - API_KEY=${API_KEY}
    ports:
      - "2024:2024"
    volumes:
      - ./Finance:/app
    networks:
      - agent_network
    restart: unless-stopped

  # Inventory Agent
  inventory:
    build:
      context: ./Inventory
      dockerfile: Dockerfile
    container_name: inventory_agent
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - INVENTORY_MODEL=${INVENTORY_MODEL}
      - POSTGRES_DSN=${POSTGRES_DSN}
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - API_KEY=${API_KEY}   
    ports:
      - "2025:2025"
    volumes:
      - ./Inventory:/app
      - inventory_chroma:/app/chroma_data
    networks:
      - agent_network
    restart: unless-stopped

  # Sales Agent
  sales:
    build:
      context: ./Sales
      dockerfile: Dockerfile
    container_name: sales_agent
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - SALES_MODEL=${SALES_MODEL}
      - VISION_MODEL=${VISION_MODEL}
      - INVENTORY_A2A_AID=${INVENTORY_A2A_AID}
      - FINANCE_A2A_AID=${FINANCE_A2A_AID}
      - API_KEY=${API_KEY}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
    ports:
      - "2026:2026"
    volumes:
      - ./Sales:/app
    networks:
      - agent_network
    restart: unless-stopped

networks:
  agent_network:
    driver: bridge

volumes:
  inventory_chroma:
    driver: local
